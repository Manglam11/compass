# Non-secret defaults for Compass. Never put secrets in this file —
# secrets are read from environment variables only (see .env.example).
environment: development
log_level: INFO

extract:
  # Frozen 11 Sep 2026 by threshold sweep on a single burned resume.
  # Sweep was flat across 0.40-0.50 (21 skills at each) - the argmax step
  # does the filtering, not this value. Do not tune further.
  embedding_threshold: 0.50

  # Rung 3: local open-weight LLM served by Ollama (docker-compose.yml,
  # 127.0.0.1:11434). Switching models is a config change only.
  rung3:
    model: qwen3:8b
    host: http://127.0.0.1:11434
    timeout_seconds: 300
    num_ctx: 8192
    temperature: 0
    seed: 42
    prompt_version: rung3_v1
    # 59 skill ids fit in well under 1024 tokens; the cap exists to end repetition loops fast.
    num_predict: 1024
