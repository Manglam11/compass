    min_core_ratio: 0.7

  - id: automation_scraping_engineer
    display_name: Automation & Scraping Engineer
    core: {python: 3, web_scraping: 3, api_integration: 2}
    supporting: {selenium: 2, beautifulsoup: 2, playwright: 2, cron: 1, postgresql: 1}
    differentiator: {docker: 1, bash: 1, linux: 1}
    min_core_ratio: 0.6

  - id: ai_genai_engineer
    display_name: AI / GenAI Engineer
    core: {python: 3, llm_integration: 3, rag: 2, prompt_engineering: 2}
    supporting:
      {fastapi: 2, nlp: 2, model_evaluation: 2, streamlit: 1, vector_db: 2, agent_frameworks: 2}
    differentiator: {docker: 1, aws: 1, experiment_tracking: 1}
    min_core_ratio: 0.7
