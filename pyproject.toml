[project]
name = "compass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manglam", email = "manglamdubey11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "streamlit>=1.63.0",
]

[project.scripts]
compass = "compass:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
